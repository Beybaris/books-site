<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">

<title>NUET Mathematics</title>
<meta name="description" content="NUET Mathematics және CSCA Математика — математикадан емтиханға өз бетіңше дайындалуға арналған баспа кітаптар. Қазақша және орысша басылым.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Onest:wght@600;800&display=swap">
<style>
/* Layout: navy "cover" band with a coordinate grid opens the page; everything after sits on light paper in one 680px reading column, wider only for the hero. */
:root{
  --navy:#042854; --navy-2:#0a3466; --grid:rgba(148,178,224,.10); --grid-major:rgba(148,178,224,.18);
  --gold:#c9a048; --gold-ink:#8a6a22;
  --paper:#f5f7fb; --card:#ffffff; --ink:#0c1a2e; --muted:#4d5d76; --line:#d8dfea; --tint:#e9eef7;
  --on-navy:#f7f4ec; --on-navy-muted:#b7c4da;
  --wa:#1f9d55; --wa-ink:#ffffff;
  --todo-bg:rgba(201,160,72,.14);
  --f-display:"Onest","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s-1:.875rem; --s0:1.0625rem; --s1:1.25rem; --s2:1.625rem; --s3:clamp(1.9rem,6.2vw,3.1rem);
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#06162b; --card:#0b2140; --ink:#e7edf6; --muted:#9fb0c8; --line:#1c3558; --tint:#0e2747;
  --gold-ink:#d9b766; --todo-bg:rgba(201,160,72,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#06162b; --card:#0b2140; --ink:#e7edf6; --muted:#9fb0c8; --line:#1c3558; --tint:#0e2747;
  --gold-ink:#d9b766; --todo-bg:rgba(201,160,72,.18); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font:400 var(--s0)/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:680px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:var(--s2);font-weight:800;line-height:1.15}
h3{font-size:var(--s1);font-weight:600;line-height:1.25}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.mono{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.todo{background:var(--todo-bg);outline:1px dashed var(--gold);outline-offset:1px;border-radius:4px;padding:0 .3em;font-style:normal}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand span{color:var(--gold)}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;gap:2px}
.lang button{font:600 .82rem/1 var(--f-body);letter-spacing:.06em;color:var(--on-navy-muted);background:none;border:0;border-radius:999px;padding:9px 14px;min-height:36px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}

/* hero */
.hero{background-color:var(--navy);color:var(--on-navy);
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:48px;align-items:center;padding-block:56px 64px}
.hero-text{min-width:0;display:grid;gap:20px}
.eyebrow{font:500 .78rem/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy-muted)}
.hero h1{font-size:var(--s3);font-weight:800;line-height:1.06}
.hero .sub{font-size:var(--s1);line-height:1.5;color:var(--on-navy);max-width:34ch}
.rule{height:2px;background:var(--gold);width:100%;max-width:420px;border:0;margin:4px 0}
.langnote{color:var(--on-navy-muted);font-size:var(--s-1);max-width:46ch}
.buy{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.price{font-family:var(--f-display);font-weight:800;font-size:1.6rem;white-space:nowrap}
.price small{font:500 .8rem var(--f-body);color:var(--on-navy-muted);display:block;letter-spacing:.02em}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:var(--wa-ink);text-decoration:none;font:600 1rem/1.2 var(--f-body);padding:15px 22px;border-radius:999px;min-height:52px;border:0;cursor:pointer;text-align:center}
.btn-wa:hover{filter:brightness(1.07)}
.btn-wa svg{width:22px;height:22px;flex:none}
.cover{margin:0;justify-self:center;width:100%;max-width:340px}
.cover img{display:block;width:100%;height:auto;aspect-ratio:210/297;border-radius:3px;box-shadow:0 24px 50px -18px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
.cover figcaption{margin-top:10px;font:500 .75rem var(--f-mono);color:var(--on-navy-muted);text-align:center;letter-spacing:.04em}

/* facts strip */
.facts{border-bottom:1px solid var(--line);background:var(--card)}
.facts ul{list-style:none;margin:0;padding-block:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.facts li{display:grid;gap:2px}
.facts b{font:800 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.facts span{font-size:var(--s-1);color:var(--muted);line-height:1.35}

section.block{padding-block:56px}
section.block + section.block{border-top:1px solid var(--line)}
.lead{color:var(--muted);margin-top:10px;max-width:60ch}

/* video */
.video-box{position:relative;margin-top:24px;max-width:360px;border-radius:var(--radius);overflow:hidden;background:var(--navy);aspect-ratio:9/16}
.video-box video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.play{position:absolute;inset:0;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;padding:0}
.play span{width:76px;height:76px;border-radius:50%;background:rgba(4,40,84,.82);border:2px solid var(--gold);display:grid;place-items:center}
.play svg{width:28px;height:28px;margin-left:4px;fill:#fff}
.video-empty{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;padding:24px;color:var(--on-navy);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.video-empty .todo{color:var(--on-navy)}

/* steps */
.steps{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:0;counter-reset:st}
.steps li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps .n{font:500 .8rem var(--f-mono);color:var(--gold-ink);padding-top:.35rem;letter-spacing:.04em}
.steps h3{margin-bottom:6px}
.steps p{color:var(--muted)}
.steps .count{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px;font:500 .85rem var(--f-mono);color:var(--ink)}
.flow{margin-top:18px;font-weight:600;font-size:var(--s-1);color:var(--muted)}
.flow i{font-style:normal;color:var(--gold-ink);padding:0 .35em}

/* topics */
.search{margin-top:22px;position:relative}
.search input{width:100%;font:400 1rem var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:13px 44px 13px 18px;min-height:48px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.everych{margin-top:12px;font-size:var(--s-1);color:var(--muted)}
.parts{margin-top:18px;display:grid;gap:10px}
details.part{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
details.part>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px;min-height:56px}
details summary::-webkit-details-marker{display:none}
.part>summary h3{font-size:1.1rem}
.part>summary .mono{font-size:.78rem;color:var(--muted);white-space:nowrap}
.chev{flex:none;width:12px;height:12px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details[open]>summary .chev{transform:rotate(-135deg) translateY(-3px)}
.sumr{display:flex;align-items:center;gap:14px;flex:none}
.chs{border-top:1px solid var(--line)}
details.ch{border-bottom:1px solid var(--line)}
details.ch:last-child{border-bottom:0}
details.ch>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:13px 18px;min-height:48px}
.ch .no{font:500 .78rem var(--f-mono);color:var(--gold-ink);white-space:nowrap}
.ch .tt{font-weight:500;line-height:1.35}
.ch .pg{font:500 .75rem var(--f-mono);color:var(--muted);white-space:nowrap}
.ch ul{margin:0;padding:0 18px 14px 18px;list-style:none;display:grid;gap:4px}
.ch li{color:var(--muted);font-size:.95rem;line-height:1.4;padding-left:14px;position:relative}
.ch li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--muted)}
mark{background:rgba(201,160,72,.32);color:inherit;border-radius:2px;padding:0 1px}
.none{margin-top:16px;color:var(--muted)}

/* authors */
.authors{margin-top:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.author{border-top:2px solid var(--ink);padding-top:14px;display:grid;gap:8px;align-content:start}
.author p{color:var(--muted)}

/* results */
.rsub{margin-top:26px;font:500 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}
.rlead{margin-top:6px;color:var(--muted)}
.nres{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ncard .top{background:var(--navy);color:var(--on-navy);padding:16px 18px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px}
.ncard .top small{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy-muted)}
.ncard .top b{font:800 2.6rem/1 var(--f-display);color:var(--gold)}
.ncard dl{margin:0;padding:6px 18px 10px}
.ncard dl div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ncard dl div:last-child{border-bottom:0}
.ncard dt{color:var(--muted)}
.ncard dd{margin:0;font:600 1.15rem var(--f-display);color:var(--ink)}
.ncard .proof{display:block;margin:0 18px 18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ncard .proof img{display:block;width:100%;height:auto}
.ncard .proof span{display:block;padding:7px 10px;font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#4d5d76;border-top:1px solid #d8dfea;background:#f5f7fb}
.sres{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.sres a{display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;aspect-ratio:3/2}
.sres a:last-child:nth-child(even){grid-column:1/-1;justify-self:center;width:calc(50% - 7px);aspect-ratio:auto}
.sres a.wide{grid-column:1/-1;aspect-ratio:auto}
.sres img{display:block;width:100%;height:100%;object-fit:contain}

/* faq */
.faq{margin-top:22px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-weight:600;min-height:52px}
.faq .ans{padding:0 0 18px;color:var(--muted);display:grid;gap:8px;max-width:62ch}

/* order */
.order{background:var(--tint)}
.order-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:22px;max-width:680px}
.orow{display:grid;gap:10px}
.olabel{font:500 .78rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.oprice{font:800 2rem/1 var(--f-display)}
.eds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ed{position:relative}
.ed input{position:absolute;opacity:0;pointer-events:none}
.ed label{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 12px;cursor:pointer;min-height:76px;height:100%}
.ed img{width:44px;height:auto;aspect-ratio:210/297;border-radius:2px;display:block}
.ed b{display:block;font-weight:600;line-height:1.25}
.ed small{color:var(--muted);font-size:.8rem;line-height:1.3;display:block}
.ed input:checked+label{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:var(--todo-bg)}
.ed input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.field input{width:100%;font:400 1rem var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px}
.deliv{color:var(--muted);display:grid;gap:6px}
.preview{background:var(--paper);border:1px solid var(--line);border-radius:10px 10px 10px 2px;padding:12px 14px;white-space:pre-line;font-size:.95rem;line-height:1.5}
.numrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:var(--s-1);color:var(--muted)}
.numrow .mono{color:var(--ink);user-select:all}
.copy{font:600 .8rem var(--f-body);background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:32px}
.order-card .btn-wa{width:100%}

footer{background:var(--navy);color:var(--on-navy-muted);font-size:.85rem;line-height:1.55}
footer .wrap{padding-block:28px 32px;display:grid;gap:10px}
footer b{color:var(--on-navy);font-family:var(--f-display)}

/* sticky mobile order bar */
.bar{display:none}
@media (max-width:760px){
  .hero .wrap{grid-template-columns:104px minmax(0,1fr);gap:14px 16px;padding-block:22px 32px;align-items:start;
    grid-template-areas:"eye eye" "h1 h1" "rule rule" "cov sub" "cov note" "buy buy"}
  .hero-text{display:contents}
  .eyebrow{grid-area:eye;font-size:.7rem}
  .hero h1{grid-area:h1;font-size:clamp(1.75rem,8.4vw,2.3rem)}
  .rule{grid-area:rule;margin:0}
  .hero .sub{grid-area:sub;font-size:1rem;line-height:1.45}
  .langnote{grid-area:note;font-size:.85rem}
  .buy{grid-area:buy;margin-top:6px}
  .buy .btn-wa{flex:1 1 220px}
  .cover{grid-area:cov;max-width:104px;justify-self:start}
  .cover img{box-shadow:0 12px 24px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
  .cover figcaption{display:none}
  .facts ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
  .facts li:last-child{grid-column:1/-1}
  section.block{padding-block:44px}
  .authors{grid-template-columns:minmax(0,1fr)}
  .nres,.sres{grid-template-columns:minmax(0,1fr)}
  .sres a:last-child:nth-child(even){width:100%}
  .sres a{aspect-ratio:auto}
  .eds{grid-template-columns:minmax(0,1fr)}
  .video-box{max-width:100%}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;
    background:var(--navy);color:var(--on-navy);border-top:1px solid rgba(255,255,255,.12);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    transition:transform .25s ease}
  .bar.off{transform:translateY(110%)}
  .bar .p{font:800 1.1rem var(--f-display);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .bar .btn-wa{min-height:44px;padding:10px 18px;font-size:.95rem}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){.btn-wa{font-size:.95rem;padding:14px 16px}}

/* book switch */
.books{background:var(--navy);border-bottom:1px solid rgba(255,255,255,.08)}
.books .wrap{padding-block:10px 12px}
.book-tab{display:grid;gap:1px;text-align:left;background:transparent;color:var(--on-navy-muted);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;min-height:52px}
.book-tab b{font:800 1rem/1.15 var(--f-display);color:var(--on-navy);letter-spacing:-.01em}
.book-tab span{font-size:.78rem;line-height:1.25}
.book-tab[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(201,160,72,.10)}
.book-tab[aria-pressed="true"] span{color:var(--on-navy)}

/* page gallery */
.gallery{margin-top:24px;display:grid;grid-auto-flow:column;grid-auto-columns:min(62%,230px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.gallery figure{margin:0;scroll-snap-align:start;display:grid;gap:8px;align-content:start}
.gallery img{display:block;width:100%;height:auto;aspect-ratio:210/297;border-radius:4px;border:1px solid var(--line);box-shadow:0 10px 24px -14px rgba(4,40,84,.45);background:#fff}
.gallery figcaption{font-size:.85rem;line-height:1.35;color:var(--muted)}
.gallery-note{margin-top:4px;font-size:.8rem;color:var(--muted)}

/* reviews */
.reviews{margin-top:22px;display:grid;gap:14px}
.review{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;display:grid;gap:12px}
.review blockquote{margin:0;display:grid;gap:8px;line-height:1.55}
.review figcaption{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.85rem;color:var(--muted)}
.review figcaption b{color:var(--ink);font-weight:600}
.review .tag{font:500 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.orig{margin-top:10px;font-size:.8rem;color:var(--muted)}

/* order: book choice */
.bks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

  aTitle: "Авторы", a1n: "Бейбарыс Бердалиев", a2n: "Арсылан Бердалиев", bioPh: "[2–3 предложения об авторе]",
  rTitle: "Результаты наших учеников", rTotal: "общий балл", rProof: "Скриншот результата", rNuetLead: "Примеры результатов NUET наших учеников.",
  qTitle: "Частые вопросы",
  oTitle: "Как заказать", oLead: "Выбери книгу и издание, напиши свой город. Кнопка откроет WhatsApp с готовым сообщением.",
  oBook: "Книга", both: "Обе книги", oEdition: "Язык книги",
  edKz: "Казахское издание", edKzNote: "Объяснения на казахском, задачи на английском",
  edRu: "Русское издание", edRuNote: "Объяснения на русском, задачи на английском",
  oCity: "Твой город (необязательно)", cityPh: "Например: Актобе",
  oDelivery: "Доставка", oPreview: "В WhatsApp откроется это сообщение", oNumber: "Номер WhatsApp:",
  copy: "Скопировать", copied: "Скопировано",
  edName: { kz: "казахский", ru: "русский" },
  msg: (books, ed, city) => `Здравствуйте! Хочу заказать ${books}.\nЯзык книги: ${ed}.\nМой город: ${city || "…"}`,
  bothNames: "NUET Mathematics и CSCA Математика",
  authorsLine: "Авторы: Бейбарыс Бердалиев, Арсылан Бердалиев.",
  discNuet: "Книга NUET Mathematics не связана с Назарбаев Университетом или Cambridge University Press & Assessment и не согласована с ними. Название NUET используется только для описания экзамена.",
  discCsca: "Книга CSCA Математика не выпущена и не одобрена организаторами CSCA. Примеры основаны на вариантах экзаменов и пробных тестов 2025–2026 годов, которые ученики запомнили и опубликовали."
}};

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k) } catch(e){ return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e){} } };
const money = n => Number(n).toLocaleString("ru-RU").replace(/[\s,]/g, " ") + " ₸";

let lang = store.get("nuet-lang"); if (lang !== "kz" && lang !== "ru") lang = "kz";
let book = (location.hash || "").replace("#", ""); if (book !== "nuet" && book !== "csca") book = "nuet";
let edition = null, edTouched = false, orderBook = null, bkTouched = false;

function waText(){
  const t = T[lang], ed = edition || lang, ob = orderBook || book;
  const names = ob === "both" ? t.bothNames : BOOKS[ob].name;
  return t.msg(names, t.edName[ed], $("#city").value.trim(), ob === "both");
}
function total(){ const ob = orderBook || book; return ob === "both" ? CONFIG.price.nuet + CONFIG.price.csca : CONFIG.price[ob]; }
function refreshOrder(){
  $("#preview").textContent = waText();
  $(".js-total").textContent = money(total());
  const href = `https://wa.me/${CONFIG.whatsapp}?text=` + encodeURIComponent(waText());
  $$(".js-wa").forEach(a => a.href = href);
}

function renderTopics(){
  const t = T[lang], B = BOOKS[book][lang], q = $("#q").value.trim().toLowerCase();
  const hl = s => { const e = esc(s); if (!q) return e; const i = s.toLowerCase().indexOf(q); return i < 0 ? e : esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+q.length)) + "</mark>" + esc(s.slice(i+q.length)); };
  let html = "", any = false;
  TOCS[book][lang].forEach((g, gi) => {
    const rows = g.ch.map(c => {
      const hitT = c.t.toLowerCase().includes(q), hitS = c.s.filter(s => s.toLowerCase().includes(q));
      if (q && !hitT && !hitS.length && !g.t.toLowerCase().includes(q)) return "";
      return `<details class="ch"${q && hitS.length ? " open" : ""}><summary><span class="no">${t.chNo(c.n)}</span><span class="tt">${hl(c.t)}</span><span class="pg">${t.pg(c.p)}</span></summary><ul>${c.s.map(s => `<li>${hl(s)}</li>`).join("")}</ul></details>`;
    }).join("");
    if (!rows) return; any = true;
    html += `<details class="part"${q ? " open" : ""}><summary><h3>${hl(g.t)}</h3><span class="sumr"><span class="mono">${t.partCount(g.ch.length)}</span><span class="chev"></span></span></summary><div class="chs">${rows}</div></details>`;
  });
  const m = B.mocks;
  if (!q || m.t.toLowerCase().includes(q) || m.items.some(s => s.toLowerCase().includes(q))) {
    any = true;
    html += `<details class="part"${q ? " open" : ""}><summary><h3>${hl(m.t)}</h3><span class="sumr"><span class="mono">${m.n}</span><span class="chev"></span></span></summary><div class="chs"><details class="ch" open><summary><span class="no">${m.n}</span><span class="tt">${t.mockRow}</span><span class="pg"></span></summary><ul>${m.items.map(s => `<li>${hl(s)}</li>`).join("")}</ul></details></div></details>`;
  }
  $("#parts").innerHTML = html;
  $("#none").hidden = any;
}

function renderMedia(){
  const t = T[lang], M = BOOKS[book].media, B = BOOKS[book][lang], box = $("#videoBox"), gal = $("#gallery");
  if (M.type === "video") {
    gal.hidden = true; box.hidden = false;
    const src = M.src[lang];
    if (box.dataset.src === src) return;
    box.dataset.src = src;
    box.innerHTML = `<video src="${esc(src)}" poster="${esc(M.poster[lang])}" muted playsinline loop preload="none"></video><button type="button" class="play" aria-label="${esc(t.vPlay)}"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>`;
    const v = box.querySelector("video"), b = box.querySelector(".play");
    b.addEventListener("click", () => { v.controls = true; b.remove(); const p = v.play(); if (p && p.catch) p.catch(() => {}); });
  } else {
    box.hidden = true; box.innerHTML = ""; box.dataset.src = "";
    gal.hidden = false;
    gal.innerHTML = B.gallery.map(([f, cap]) => `<figure><img src="csca/${f}.webp" width="620" height="877" loading="lazy" alt="${esc(cap)}"><figcaption>${esc(cap)}</figcaption></figure>`).join("") ;
  }
}

function renderReviews(){
  const list = REVIEWS[book] || [], t = T[lang];
  $("#reviews").hidden = !list.length;
  $("#reviewList").innerHTML = list.map(r => `<figure class="review" lang="${r.lang === "kz" ? "kk" : "ru"}"><blockquote>${r.text.map(p => `<p>${esc(p)}</p>`).join("")}</blockquote><figcaption><b>${esc(r.who[lang])}</b><span>CSCA Математика</span><span class="tag">${esc(t.langTag[r.lang])}</span></figcaption></figure>`).join("");
}

function apply(){
  const t = T[lang], BK = BOOKS[book], B = BK[lang];
  document.documentElement.lang = t.htmlLang;
  $$("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.innerHTML = v; });
  $$("[data-b]").forEach(el => { const v = B[el.dataset.b]; if (typeof v === "string") el.innerHTML = v; });
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $$(".book-tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.book === book)));
  $(".js-brand").innerHTML = BK.brand;
  document.title = BK.name;
  const img = $(".js-cover"); img.src = BK.cover[lang]; img.alt = B.coverAlt;
  $(".js-pages").textContent = t.pages(BK.pages[lang]);
  $$(".js-price").forEach(el => el.textContent = money(CONFIG.price[book]));
  $$(".js-pn").forEach(el => el.textContent = money(CONFIG.price.nuet));
  $$(".js-pc").forEach(el => el.textContent = money(CONFIG.price.csca));
  $$(".js-p2").forEach(el => el.textContent = money(CONFIG.price.nuet + CONFIG.price.csca));
  $("#facts").innerHTML = B.facts.map(([n, l]) => `<li><b>${esc(n)}</b><span>${esc(l)}</span></li>`).join("");
  $("#steps").innerHTML = B.steps.map(([h, p, c], i) => `<li><span class="n">0${i+1}</span><div><h3>${esc(h)}</h3><p>${esc(p)}</p><p class="count">${c.map(x => `<span>${esc(x)}</span>`).join("")}</p></div></li>`).join("");
  $("#q").placeholder = t.tSearch[book];
  $("#city").placeholder = t.cityPh;
  const del = `<p>${esc(CONFIG.delivery[lang])}</p>`;
  $(".js-delivery").innerHTML = del;
  $("#faq").innerHTML = B.faq.map(([q, a], i) => `<details id="faq-${book}-${i}"><summary>${esc(q)}<span class="chev"></span></summary><div class="ans">${a ? a.map(p => `<p>${esc(p)}</p>`).join("") : del}</div></details>`).join("");
  $(".js-num").textContent = "+" + CONFIG.whatsapp;
  [["beibarys","#bio1"],["arsylan","#bio2"]].forEach(([w, sel]) => { const b = CONFIG.bio[w][lang]; $(sel).innerHTML = b ? esc(b) : `<em class="todo">${t.bioPh}</em>`; });
  const ob = orderBook || book;
  $(".js-ed-kz").src = BOOKS[ob === "both" ? book : ob].cover.kz;
  $(".js-ed-ru").src = BOOKS[ob === "both" ? book : ob].cover.ru;
  if (!edTouched) edition = lang;
  if (!bkTouched) orderBook = book;
  $("#ed-" + edition).checked = true;
  $("#bk-" + orderBook).checked = true;
  renderTopics(); renderMedia(); renderReviews(); refreshOrder();
}

$$(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("nuet-lang", lang); apply(); }));
$$(".book-tab").forEach(b => b.addEventListener("click", () => {
  if (book === b.dataset.book) return;
  book = b.dataset.book; $("#q").value = "";
  try { history.replaceState(null, "", "#" + book); } catch(e) { location.hash = book; }
  apply();
}));
window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if ((h === "nuet" || h === "csca") && h !== book) { book = h; apply(); } });
$$('input[name="ed"]').forEach(r => r.addEventListener("change", () => { edition = r.value; edTouched = true; refreshOrder(); }));
$$('input[name="bk"]').forEach(r => r.addEventListener("change", () => { orderBook = r.value; bkTouched = true; apply(); }));
$("#city").addEventListener("input", refreshOrder);
$("#q").addEventListener("input", renderTopics);
$("#orderForm").addEventListener("submit", e => e.preventDefault());
$("#copyNum").addEventListener("click", e => {
  const btn = e.currentTarget, txt = "+" + CONFIG.whatsapp;
  const done = () => { btn.textContent = T[lang].copied; setTimeout(() => btn.textContent = T[lang].copy, 1600); };
  const sel = () => { const r = document.createRange(); r.selectNodeContents($(".js-num")); getSelection().removeAllRanges(); getSelection().addRange(r); };
  try { navigator.clipboard.writeText(txt).then(done, sel); } catch(err) { sel(); }
});

(function(){
  const bar = $("#bar"); const seen = new Set();
  if (!("IntersectionObserver" in window)) { bar.classList.remove("off"); return; }
  const io = new IntersectionObserver(es => {
    es.forEach(e => e.isIntersecting ? seen.add(e.target) : seen.delete(e.target));
    const off = seen.size > 0; bar.classList.toggle("off", off); bar.setAttribute("aria-hidden", String(off));
    $("#cta-bar").tabIndex = off ? -1 : 0;
  });
  io.observe($("#cta-hero")); io.observe($("#order"));
})();

apply();
</script>

</body>
</html>
